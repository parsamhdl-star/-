<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365D"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="هخامنش ۲۱"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>ساختمان هخامنش ۲۱</title></head><body><div id="app"></div><script src="app.js"></script><script>
if('serviceWorker' in navigator){
  addEventListener('load', async ()=>{
    try {
      const reg=await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    } catch(e) { console.warn('SW',e); }
  });
}
</script></body></html>
